<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexusHUB AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:#FDFBF7;color:#000;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace}

  .sh-sm{box-shadow:2px 2px 0 0 #000}
  .sh{box-shadow:3px 3px 0 0 #000}
  .sh-lg{box-shadow:4px 4px 0 0 #000}
  .bd{border:2.5px solid #000}
  .bd-2{border:2px solid #000}
  .btn-brutal{transition:transform .12s ease,box-shadow .12s ease}
  .btn-brutal:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 #000}
  .btn-brutal:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}

  .pgreen{background:#86EFAC}
  .pyellow{background:#FDE047}
  .porange{background:#FDBA74}
  .pred{background:#FCA5A5}
  .cream{background:#FDFBF7}

  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.4s infinite}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#000;border-radius:3px}

  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:10px;
    gap:8px;
    max-width:900px;
    margin:0 auto;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
  }

  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    background:#fff;
    border:2.5px solid #000;
    border-radius:14px;
    box-shadow:3px 3px 0 0 #000;
    flex-shrink:0;
  }
  .header-left{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:38px;height:38px;flex-shrink:0;
    background:#86EFAC;
    border:2px solid #000;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand{min-width:0}
  .brand-name{font-weight:800;font-size:14px;line-height:1.1;letter-spacing:-.3px}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:1.5px;opacity:.5;margin-top:2px}

  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;
    background:#fff;
    border:2px solid #000;border-radius:999px;
    box-shadow:2px 2px 0 0 #000;
    font-weight:800;font-size:9.5px;letter-spacing:.8px;
    flex-shrink:0;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#16a34a;border:1.5px solid #000}
  .status-dot.offline{background:#ef4444}

  .model-bar{position:relative;flex-shrink:0}
  .model-btn{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:12px;
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .model-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}
  .model-btn-left{display:flex;align-items:center;gap:8px;min-width:0}
  .model-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #000;flex-shrink:0}
  .model-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

  .dropdown{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:5px 5px 0 0 #000;
    z-index:100;
    max-height:60vh;
    overflow-y:auto;
    display:none;
  }
  .dropdown.show{display:block}
  .dropdown-header{
    padding:8px 12px;
    background:#86EFAC;
    border-bottom:2px solid #000;
    font-weight:800;font-size:9.5px;letter-spacing:1.3px;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;
  }
  .model-item{
    padding:10px 12px;
    border-bottom:1.5px dashed #ddd;
    cursor:pointer;
    display:flex;align-items:flex-start;gap:10px;
  }
  .model-item:last-child{border-bottom:none}
  .model-item:active{background:#FEF9C3}
  .model-item.active{background:#86EFAC}
  .model-item .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #000;flex-shrink:0;margin-top:4px}
  .model-item .info{flex:1;min-width:0}
  .model-item .title{font-weight:800;font-size:12px;margin-bottom:1px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .model-item .desc{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#666}

  .chat-wrap{
    flex:1;
    min-height:0;
    background:#fff;
    border:2.5px solid #000;
    border-radius:14px;
    box-shadow:3px 3px 0 0 #000;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .chat-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:#FDFBF7;
  }

  .msg{
    max-width:88%;
    padding:10px 12px;
    border:2px solid #000;border-radius:14px;
    box-shadow:2px 2px 0 0 #000;
    font-size:13px;line-height:1.55;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .msg.user{background:#FDE047;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.assistant{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
  .msg-model{
    display:inline-block;
    padding:1px 7px;
    font-size:9px;font-weight:800;letter-spacing:.4px;
    border:1.5px solid #000;border-radius:999px;
    margin-bottom:5px;text-transform:uppercase;
  }
  .msg-time{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;opacity:.5;
    margin-top:5px;
  }
  .msg-image{
    max-width:200px;max-height:200px;
    border:2px solid #000;border-radius:10px;
    box-shadow:2px 2px 0 0 #000;
    margin:5px 0;display:block;object-fit:cover;cursor:pointer;
  }

  .code-block{
    background:#101010;color:#D4D4D4;
    border:2px solid #000;border-radius:8px;
    margin:8px 0;padding:8px 10px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;line-height:1.6;
    overflow-x:auto;
  }
  .code-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:6px;margin-bottom:6px;
    border-bottom:1px dashed #444;font-size:10px;
  }
  .code-lang{color:#86EFAC;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
  .copy-btn{
    background:#86EFAC;color:#000;
    border:1.5px solid #000;border-radius:5px;
    padding:2px 7px;font-size:9.5px;font-weight:800;
    cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  }
  .code-block pre{white-space:pre-wrap;word-wrap:break-word}

  .typing{
    display:none;
    align-self:flex-start;
    background:#fff;
    border:2px solid #000;border-radius:14px;
    box-shadow:2px 2px 0 0 #000;
    padding:10px 14px;
  }
  .typing.show{display:flex;gap:5px;align-items:center}
  .typing-dot{width:7px;height:7px;border-radius:50%;background:#000;animation:td 1.2s infinite}
  .typing-dot:nth-child(2){animation-delay:.15s}
  .typing-dot:nth-child(3){animation-delay:.3s}
  @keyframes td{
    0%,60%,100%{transform:translateY(0);opacity:.35}
    30%{transform:translateY(-5px);opacity:1}
  }

  .error-box{
    margin:0 10px 8px;
    padding:9px 12px;
    background:#FCA5A5;
    border:2px solid #000;border-radius:10px;
    box-shadow:2px 2px 0 0 #000;
    font-size:11.5px;font-weight:700;
    display:none;
  }
  .error-box.show{display:block}

  .input-area{
    padding:10px;
    background:#fff;
    border-top:2.5px solid #000;
    flex-shrink:0;
  }

  .attach-preview{
    display:none;
    padding:8px;
    background:#FDFBF7;
    border:2px solid #000;border-radius:10px;
    box-shadow:2px 2px 0 0 #000;
    margin-bottom:8px;
    align-items:center;gap:8px;
  }
  .attach-preview.show{display:flex}
  .attach-thumb{
    width:44px;height:44px;
    object-fit:cover;border:2px solid #000;border-radius:8px;flex-shrink:0;
  }
  .attach-info{flex:1;min-width:0}
  .attach-name{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach-size{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#666}
  .attach-x{
    width:28px;height:28px;
    background:#FCA5A5;border:2px solid #000;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }

  .input-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
  }

  .icon-btn{
    width:42px;height:42px;flex-shrink:0;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .icon-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}
  .icon-btn.send{
    background:#000;color:#fff;
    border-color:#000;
  }
  .icon-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 0 #000}

  textarea.chat-input{
    flex:1;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;font-weight:500;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    padding:10px 12px;
    outline:none;resize:none;
    min-height:42px;max-height:120px;
    line-height:1.4;
  }
  textarea.chat-input::placeholder{color:#999}
  textarea.chat-input:focus{box-shadow:4px 4px 0 0 #000}

  .input-info{
    margin-top:7px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;color:#666;font-weight:600;
    gap:8px;flex-wrap:wrap;
  }
  .input-info .mono{font-size:9px}

  @media (max-width:380px){
    .brand-name{font-size:13px}
    .msg{max-width:92%;font-size:12.5px}
    .chat-scroll{padding:10px}
    .input-area{padding:8px}
    .icon-btn{width:40px;height:40px}
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-name">NexusHUB AI</div>
        <div class="brand-sub">BY XS0CIETY</div>
      </div>
    </div>
    <div class="status-pill">
      <span id="statusDot" class="status-dot pulse"></span>
      <span id="statusText">READY</span>
    </div>
  </div>

  <div class="model-bar">
    <button id="modelBtn" class="model-btn" type="button">
      <div class="model-btn-left">
        <span id="modelDot" class="model-dot" style="background:#86EFAC"></span>
        <span id="modelName" class="model-name">Auto (Smart)</span>
      </div>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div id="dropdown" class="dropdown">
      <div class="dropdown-header">
        <span>PILIH MODEL AI</span>
      </div>
      <div id="modelList"></div>
    </div>
  </div>

  <div class="chat-wrap">
    <div id="chatScroll" class="chat-scroll"></div>
    <div id="errorBox" class="error-box"></div>

    <div class="input-area">
      <div id="attachPreview" class="attach-preview">
        <img id="attachThumb" class="attach-thumb" alt="">
        <div class="attach-info">
          <div id="attachName" class="attach-name">image.jpg</div>
          <div id="attachSize" class="attach-size">0 KB</div>
        </div>
        <button type="button" id="attachX" class="attach-x">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <input type="file" id="fileInput" accept="image/*" style="display:none">

      <div class="input-row">
        <button type="button" id="attachBtn" class="icon-btn" title="Lampirkan gambar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        </button>

        <textarea id="chatInput" class="chat-input" placeholder="Ketik pesan..." rows="1"></textarea>

        <button type="button" id="sendBtn" class="icon-btn send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
            <path d="m21.854 2.147-10.94 10.939"/>
          </svg>
        </button>
      </div>

      <div class="input-info">
        <span id="infoText">Siap membantu kamu</span>
        <span class="mono">© xs0ciety HUB</span>
      </div>
    </div>
  </div>
</div>

<script>
/* =================================================================
   CONFIG
================================================================= */
const CONFIG = {
  PROXY_ENDPOINT: '/api/chat',
  SYSTEM_PROMPT: `Kamu adalah NexusHUB AI, asisten AI canggih yang dikembangkan oleh xs0ciety HUB. Kamu membantu user dengan jawaban yang jelas, akurat, dan ramah. Kamu menguasai banyak topik: coding, teknologi, sains, kreatif, dan lain-lain. Jawab dengan gaya santai tapi profesional dalam Bahasa Indonesia. Kalau user pakai Bahasa Inggris, balas pakai Bahasa Inggris juga. Kalau user kirim gambar, jelaskan isi gambar tersebut dengan detail.`,
  TEMPERATURE: 0.7,
  MAX_TOKENS: 2048,
  MAX_IMAGE_SIZE_MB: 5
};

/* =================================================================
   MODEL LIST — pakai router otomatis + model spesifik yang masih aktif
   Update: gunakan model yang sudah diverifikasi aktif per 2026
================================================================= */
const MODELS = [
  {
    id: 'auto-smart',
    name: 'Auto (Smart)',
    model: 'openrouter/free',
    desc: 'Auto-route ke model terbaik',
    color: '#86EFAC',
    supportVision: true
  },
  {
    id: 'qwen3-coder',
    name: 'Qwen3 Coder',
    model: 'qwen/qwen3-coder:free',
    desc: 'Coding · High performance',
    color: '#FDBA74',
    supportVision: false
  },
  {
    id: 'gpt-oss-120b',
    name: 'GPT-OSS 120B',
    model: 'openai/gpt-oss-120b:free',
    desc: 'General purpose · Large',
    color: '#C4B5FD',
    supportVision: false
  },
  {
    id: 'gemma-3-27b',
    name: 'Gemma 3 27B',
    model: 'google/gemma-3-27b-it:free',
    desc: 'Multimodal · Google',
    color: '#7DD3FC',
    supportVision: true
  }
];

const DEFAULT_MODEL_ID = MODELS[0].id;
const MODEL_STORAGE_KEY = 'nexushub.model.v4';

/* =================================================================
   UTILS
================================================================= */
const pad = n => String(n).padStart(2,'0');
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const escapeHtml = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const getModelById = id => MODELS.find(m => m.id === id) || MODELS[0];
const fmtSize = bytes => {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
};

/* =================================================================
   STATE
================================================================= */
let messageHistory = [];
let currentModel = getModelById(localStorage.getItem(MODEL_STORAGE_KEY) || DEFAULT_MODEL_ID);
let pendingImage = null;
let isSending = false;

/* =================================================================
   DOM
================================================================= */
const chatScroll    = document.getElementById('chatScroll');
const chatInput     = document.getElementById('chatInput');
const sendBtn       = document.getElementById('sendBtn');
const errorBox      = document.getElementById('errorBox');
const statusDot     = document.getElementById('statusDot');
const statusText    = document.getElementById('statusText');
const modelBtn      = document.getElementById('modelBtn');
const dropdown      = document.getElementById('dropdown');
const modelList     = document.getElementById('modelList');
const modelNameEl   = document.getElementById('modelName');
const modelDotEl    = document.getElementById('modelDot');
const fileInput     = document.getElementById('fileInput');
const attachBtn     = document.getElementById('attachBtn');
const attachPreview = document.getElementById('attachPreview');
const attachThumb   = document.getElementById('attachThumb');
const attachName    = document.getElementById('attachName');
const attachSize    = document.getElementById('attachSize');
const attachX       = document.getElementById('attachX');

/* =================================================================
   MODEL SELECTOR
================================================================= */
function renderModelList(){
  modelList.innerHTML = '';
  MODELS.forEach(m => {
    const isActive = m.id === currentModel.id;
    const el = document.createElement('div');
    el.className = 'model-item' + (isActive ? ' active' : '');
    el.innerHTML = `
      <span class="dot" style="background:${m.color}"></span>
      <div class="info">
        <div class="title">${escapeHtml(m.name)}</div>
        <div class="desc">${escapeHtml(m.desc)}</div>
      </div>
    `;
    el.addEventListener('click', () => {
      selectModel(m.id);
      dropdown.classList.remove('show');
    });
    modelList.appendChild(el);
  });
}

function selectModel(id){
  const m = getModelById(id);
  if (m.id === currentModel.id) return;
  currentModel = m;
  localStorage.setItem(MODEL_STORAGE_KEY, m.id);
  modelNameEl.textContent = m.name;
  modelDotEl.style.background = m.color;

  messageHistory = [];
  chatScroll.innerHTML = '';
  addMessage('assistant',
    `Model diganti ke **${m.name}**.\n\n${m.desc}\n\nMulai percakapan baru ya!`,
    { badge: m.name, color: m.color }
  );

  if (!m.supportVision && pendingImage){
    clearImage();
    showError(`${m.name} tidak support gambar. Attachment dihapus.`);
  }
  renderModelList();
}

modelBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdown.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!dropdown.contains(e.target) && e.target !== modelBtn){
    dropdown.classList.remove('show');
  }
});

/* =================================================================
   IMAGE
================================================================= */
attachBtn.addEventListener('click', () => {
  if (!currentModel.supportVision){
    showError(`${currentModel.name} tidak support gambar. Coba model lain.`);
    return;
  }
  fileInput.click();
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  handleFile(file);
  fileInput.value = '';
});

function handleFile(file){
  if (!file.type.startsWith('image/')){
    showError('Hanya file gambar (JPG, PNG, WEBP, GIF).');
    return;
  }
  if (file.size > CONFIG.MAX_IMAGE_SIZE_MB * 1024 * 1024){
    showError(`Max ukuran ${CONFIG.MAX_IMAGE_SIZE_MB} MB.`);
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingImage = { dataUrl: ev.target.result, name: file.name, size: file.size };
    showAttachPreview();
  };
  reader.readAsDataURL(file);
}

function showAttachPreview(){
  if (!pendingImage) return;
  attachThumb.src = pendingImage.dataUrl;
  attachName.textContent = pendingImage.name;
  attachSize.textContent = fmtSize(pendingImage.size);
  attachPreview.classList.add('show');
}

function clearImage(){
  pendingImage = null;
  attachPreview.classList.remove('show');
  attachThumb.src = '';
}

attachX.addEventListener('click', clearImage);

/* =================================================================
   INPUT
================================================================= */
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

/* =================================================================
   SEND
================================================================= */
async function sendMessage(){
  const message = chatInput.value.trim();
  const hasImage = !!pendingImage;
  if ((!message && !hasImage) || isSending) return;

  isSending = true;
  sendBtn.disabled = true;

  addMessage('user', message || '(mengirim gambar)', { image: pendingImage?.dataUrl });
  const apiContent = buildUserContent(message, pendingImage);

  chatInput.value = '';
  chatInput.style.height = 'auto';
  clearImage();
  showTyping();

  try {
    const reply = await callProxy(apiContent);
    hideTyping();
    addMessage('assistant', reply, { badge: currentModel.name, color: currentModel.color });
    messageHistory.push({ role: 'user', content: apiContent });
    messageHistory.push({ role: 'assistant', content: reply });
    setStatus('READY', true);
  } catch (err){
    hideTyping();
    showError(formatError(err.message));
    setStatus('ERROR', false);
  }

  isSending = false;
  sendBtn.disabled = false;
  chatInput.focus();
}

function buildUserContent(text, image){
  if (!image) return text || '';
  const parts = [];
  if (text) parts.push({ type: 'text', text });
  parts.push({ type: 'image_url', image_url: { url: image.dataUrl } });
  return parts;
}

function formatError(msg){
  if (/no endpoints found|404|unavailable|not available/i.test(msg)){
    return 'Model ini sedang tidak tersedia. Coba ganti ke model lain.';
  }
  if (/rate limit|429|too many/i.test(msg)){
    return 'Terlalu banyak request. Tunggu beberapa saat.';
  }
  if (/401|unauthorized|no auth/i.test(msg)){
    return 'Konfigurasi server belum lengkap. Hubungi admin.';
  }
  if (/402|insufficient/i.test(msg)){
    return 'Layanan sedang tidak tersedia. Coba model lain.';
  }
  if (/timeout/i.test(msg)){
    return 'Server lama merespon. Coba kirim ulang.';
  }
  if (/network|fetch|failed to fetch/i.test(msg)){
    return 'Koneksi ke server gagal. Cek internet kamu.';
  }
  return 'Terjadi kesalahan. Coba lagi.';
}

/* =================================================================
   API
================================================================= */
async function callProxy(userContent){
  const messages = [
    { role: 'system', content: CONFIG.SYSTEM_PROMPT },
    ...messageHistory.slice(-15),
    { role: 'user', content: userContent }
  ];

  const body = {
    model: currentModel.model,
    messages,
    temperature: CONFIG.TEMPERATURE,
    max_tokens: CONFIG.MAX_TOKENS
  };

  const res = await fetch(CONFIG.PROXY_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  let data;
  try { data = await res.json(); }
  catch { throw new Error(`HTTP ${res.status}`); }

  if (!res.ok){
    throw new Error(data?.error?.message || `HTTP ${res.status}`);
  }

  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('Response kosong dari server.');
  return content;
}

/* =================================================================
   RENDER
================================================================= */
function addMessage(role, content, opts = {}){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  let html = '';
  if (role === 'assistant' && opts.badge){
    html += `<span class="msg-model" style="background:${opts.color || '#86EFAC'}">${escapeHtml(opts.badge)}</span>`;
  }
  if (opts.image){
    html += `<img src="${opts.image}" class="msg-image" onclick="openImage(this.src)" alt="">`;
  }
  html += formatMessage(content);
  html += `<div class="msg-time">${nowTime()}</div>`;

  wrap.innerHTML = html;

  const typing = document.getElementById('typingIndicator');
  if (typing) chatScroll.insertBefore(wrap, typing);
  else chatScroll.appendChild(wrap);

  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function formatMessage(content){
  if (Array.isArray(content)){
    const t = content.find(p => p.type === 'text');
    content = t?.text || '(gambar)';
  }
  if (typeof content !== 'string') content = String(content);

  if (content.includes('```')){
    const parts = content.split('```');
    let html = '';
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 0){
        html += renderInline(parts[i]);
      } else {
        const lines = parts[i].split('\n');
        const lang = (lines[0] || 'code').trim() || 'code';
        const code = lines.slice(1).join('\n');
        html += `
          <div class="code-block">
            <div class="code-header">
              <span class="code-lang">${escapeHtml(lang)}</span>
              <button class="copy-btn" onclick="copyCode(this)">Salin</button>
            </div>
            <pre><code>${escapeHtml(code)}</code></pre>
          </div>`;
      }
    }
    return html;
  }
  return renderInline(content);
}

function renderInline(text){
  let s = escapeHtml(text);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:#eee;padding:1px 5px;border-radius:4px;border:1px solid #000;font-family:JetBrains Mono,monospace;font-size:11px">$1</code>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

window.copyCode = function(btn){
  const code = btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'OK';
    setTimeout(() => { btn.textContent = orig; }, 1200);
  });
};

window.openImage = function(src){
  const w = window.open('');
  if (w){
    w.document.write(`<html><head><title>Image</title><style>body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh}img{max-width:95vw;max-height:95vh;border:3px solid #000}</style></head><body><img src="${src}"></body></html>`);
    w.document.close();
  }
};

/* =================================================================
   TYPING / STATUS / ERROR
================================================================= */
function showTyping(){
  let t = document.getElementById('typingIndicator');
  if (!t){
    t = document.createElement('div');
    t.id = 'typingIndicator';
    t.className = 'typing';
    t.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
    chatScroll.appendChild(t);
  }
  t.classList.add('show');
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if (t) t.classList.remove('show');
}

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add('show');
  clearTimeout(errorBox._t);
  errorBox._t = setTimeout(() => errorBox.classList.remove('show'), 8000);
}

function setStatus(text, ok){
  statusText.textContent = text;
  statusDot.classList.toggle('offline', !ok);
}

/* =================================================================
   INIT
================================================================= */
function initChat(){
  modelNameEl.textContent = currentModel.name;
  modelDotEl.style.background = currentModel.color;
  renderModelList();

  chatScroll.innerHTML = '';
  messageHistory = [];

  addMessage('assistant',
    `Halo! Saya **NexusHUB AI**.\n\nModel aktif: **${currentModel.name}**\n\nKetik pesan buat mulai ngobrol.`,
    { badge: currentModel.name, color: currentModel.color }
  );
}

initChat();
chatInput.focus();
</script>
