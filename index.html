<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>NexusHUB AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:#FDFBF7;color:#000;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace}

  .sh-sm{box-shadow:2px 2px 0 0 #000}
  .sh{box-shadow:3px 3px 0 0 #000}
  .sh-lg{box-shadow:4px 4px 0 0 #000}
  .bd{border:2.5px solid #000}
  .bd-2{border:2px solid #000}
  .btn-brutal{transition:transform .12s ease,box-shadow .12s ease}

  .pgreen{background:#86EFAC}
  .pyellow{background:#FDE047}
  .porange{background:#FDBA74}
  .pred{background:#FCA5A5}
  .pcyan{background:#7DD3FC}
  .cream{background:#FDFBF7}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pulse{animation:pulse 1.4s infinite}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#000;border-radius:3px}

  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:10px;
    gap:8px;
    max-width:900px;
    margin:0 auto;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
  }

  .header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;
    background:#fff;
    border:2.5px solid #000;border-radius:14px;
    box-shadow:3px 3px 0 0 #000;
    flex-shrink:0;
  }
  .header-left{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:38px;height:38px;flex-shrink:0;
    background:#86EFAC;
    border:2px solid #000;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
  }
  .brand{min-width:0}
  .brand-name{font-weight:800;font-size:14px;line-height:1.1;letter-spacing:-.3px}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:600;letter-spacing:1.5px;opacity:.5;margin-top:2px}

  .status-pill{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 10px;
    background:#fff;
    border:2px solid #000;border-radius:999px;
    box-shadow:2px 2px 0 0 #000;
    font-weight:800;font-size:9.5px;letter-spacing:.8px;
    flex-shrink:0;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#16a34a;border:1.5px solid #000}
  .status-dot.offline{background:#ef4444}
  .status-dot.busy{background:#eab308}

  .model-bar{position:relative;flex-shrink:0}
  .model-btn{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px 12px;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:12px;
    cursor:pointer;
  }
  .model-btn-left{display:flex;align-items:center;gap:8px;min-width:0}
  .model-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #000;flex-shrink:0}
  .model-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

  .dropdown{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:5px 5px 0 0 #000;
    z-index:100;
    max-height:60vh;overflow-y:auto;
    display:none;
  }
  .dropdown.show{display:block}
  .dropdown-header{
    padding:8px 12px;
    background:#86EFAC;
    border-bottom:2px solid #000;
    font-weight:800;font-size:9.5px;letter-spacing:1.3px;
    position:sticky;top:0;
  }
  .model-item{
    padding:10px 12px;
    border-bottom:1.5px dashed #ddd;
    cursor:pointer;
    display:flex;align-items:flex-start;gap:10px;
  }
  .model-item:last-child{border-bottom:none}
  .model-item.active{background:#86EFAC}
  .model-item .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #000;flex-shrink:0;margin-top:4px}
  .model-item .info{flex:1;min-width:0}
  .model-item .title{font-weight:800;font-size:12px;margin-bottom:1px}
  .model-item .desc{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#666}

  .chat-wrap{
    flex:1;min-height:0;
    background:#fff;
    border:2.5px solid #000;border-radius:14px;
    box-shadow:3px 3px 0 0 #000;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .chat-scroll{
    flex:1;overflow-y:auto;
    padding:14px;
    display:flex;flex-direction:column;gap:10px;
    background:#FDFBF7;
  }

  .msg{
    max-width:88%;
    padding:10px 12px;
    border:2px solid #000;border-radius:14px;
    box-shadow:2px 2px 0 0 #000;
    font-size:13px;line-height:1.55;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .msg.user{background:#FDE047;align-self:flex-end;border-bottom-right-radius:4px}
  .msg.assistant{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
  .msg-model{
    display:inline-block;
    padding:1px 7px;
    font-size:9px;font-weight:800;letter-spacing:.4px;
    border:1.5px solid #000;border-radius:999px;
    margin-bottom:5px;text-transform:uppercase;
  }
  .msg-time{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;opacity:.5;
    margin-top:5px;
  }
  .msg-image{
    max-width:200px;max-height:200px;
    border:2px solid #000;border-radius:10px;
    box-shadow:2px 2px 0 0 #000;
    margin:0 0 8px 0;
    display:block;object-fit:cover;cursor:pointer;
  }

  .msg-file{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    background:#fff;
    border:2px solid #000;border-radius:8px;
    box-shadow:2px 2px 0 0 #000;
    margin-bottom:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    max-width:100%;
    width:fit-content;
  }
  .msg-file .file-ext{
    background:#86EFAC;
    border:1.5px solid #000;border-radius:4px;
    padding:1px 6px;
    font-weight:800;font-size:9px;
    text-transform:uppercase;
    flex-shrink:0;
  }
  .msg-file .file-name{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:600;
  }
  .msg-text{display:block}

  .code-block{
    background:#101010;color:#D4D4D4;
    border:2px solid #000;border-radius:8px;
    margin:8px 0;padding:8px 10px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;line-height:1.6;
    overflow-x:auto;
  }
  .code-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:6px;margin-bottom:6px;
    border-bottom:1px dashed #444;font-size:10px;
  }
  .code-lang{color:#86EFAC;text-transform:uppercase;font-weight:700;letter-spacing:.5px}
  .copy-btn{
    background:#86EFAC;color:#000;
    border:1.5px solid #000;border-radius:5px;
    padding:2px 7px;font-size:9.5px;font-weight:800;
    cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  }
  .code-block pre{white-space:pre-wrap;word-wrap:break-word;max-height:280px;overflow-y:auto}

  .typing{
    display:none;align-self:flex-start;
    background:#fff;
    border:2px solid #000;border-radius:14px;
    box-shadow:2px 2px 0 0 #000;
    padding:10px 14px;
  }
  .typing.show{display:flex;gap:5px;align-items:center}
  .typing-dot{width:7px;height:7px;border-radius:50%;background:#000;animation:td 1.2s infinite}
  .typing-dot:nth-child(2){animation-delay:.15s}
  .typing-dot:nth-child(3){animation-delay:.3s}
  @keyframes td{
    0%,60%,100%{transform:translateY(0);opacity:.35}
    30%{transform:translateY(-5px);opacity:1}
  }

  .error-box{
    margin:0 10px 8px;
    padding:9px 12px;
    background:#FCA5A5;
    border:2px solid #000;border-radius:10px;
    box-shadow:2px 2px 0 0 #000;
    font-size:11px;font-weight:600;
    display:none;
    font-family:'JetBrains Mono',monospace;
    word-break:break-word;
    max-height:120px;overflow-y:auto;
  }
  .error-box.show{display:block}

  .input-area{
    padding:10px;
    background:#fff;
    border-top:2.5px solid #000;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .attach-bar{
    display:none;
    background:#fff;
    border:2.5px solid #000;
    border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    padding:10px;
    align-items:center;
    gap:10px;
    animation:slideUp .2s ease;
    position:relative;
    overflow:hidden;
  }
  .attach-bar.show{display:flex}
  .attach-bar::before{
    content:'';
    position:absolute;
    top:0;left:0;bottom:0;
    width:5px;
    background:#86EFAC;
  }
  .attach-bar.image::before{background:#7DD3FC}
  .attach-bar.text::before{background:#86EFAC}

  .attach-thumb-wrap{
    width:48px;height:48px;
    flex-shrink:0;
    margin-left:4px;
  }
  .attach-thumb{
    width:48px;height:48px;
    object-fit:cover;
    border:2px solid #000;border-radius:10px;
    background:#fff;
    display:block;
  }
  .attach-file-icon{
    width:48px;height:48px;
    border:2px solid #000;border-radius:10px;
    background:#86EFAC;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#000;
  }

  .attach-info{flex:1;min-width:0}
  .attach-label{
    font-family:'JetBrains Mono',monospace;
    font-size:8.5px;font-weight:700;
    letter-spacing:1.3px;
    color:#666;
    margin-bottom:3px;
    text-transform:uppercase;
  }
  .attach-name{
    font-size:12.5px;font-weight:800;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    margin-bottom:2px;
    line-height:1.2;
  }
  .attach-size{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:#666;font-weight:600;
  }

  .attach-x{
    width:34px;height:34px;
    background:#FCA5A5;
    border:2px solid #000;border-radius:9px;
    box-shadow:2px 2px 0 0 #000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }

  .input-row{
    display:flex;align-items:flex-end;gap:8px;
  }
  .icon-btn{
    width:42px;height:42px;flex-shrink:0;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}
  .icon-btn.send{background:#000;color:#fff;border-color:#000}
  .icon-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:3px 3px 0 0 #000}

  textarea.chat-input{
    flex:1;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;font-weight:500;
    background:#fff;
    border:2.5px solid #000;border-radius:12px;
    box-shadow:3px 3px 0 0 #000;
    padding:10px 12px;
    outline:none;resize:none;
    min-height:42px;max-height:120px;
    line-height:1.4;
  }
  textarea.chat-input::placeholder{color:#999}

  .input-info{
    display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;color:#666;font-weight:600;
    gap:8px;flex-wrap:wrap;
  }
  .input-info .mono{font-size:9px}

  /* ============================================================
     BOTTOM SHEET — Attachment picker
  ============================================================ */
  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .sheet-backdrop.show{opacity:1;pointer-events:auto}

  .attach-sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:201;
    background:#fff;
    border-top:3px solid #000;
    border-radius:22px 22px 0 0;
    box-shadow:0 -5px 0 0 #000;
    transform:translateY(105%);
    transition:transform .28s cubic-bezier(.22,.9,.3,1);
    max-height:80vh;
    overflow-y:auto;
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    max-width:900px;
    margin:0 auto;
  }
  .attach-sheet.show{transform:translateY(0)}

  .sheet-handle{
    width:44px;height:5px;
    background:#000;
    border-radius:3px;
    margin:10px auto 4px;
    opacity:.25;
  }

  .sheet-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 18px 12px;
    border-bottom:2px solid #000;
  }
  .sheet-title{
    font-weight:800;font-size:15px;
    letter-spacing:-.3px;
  }
  .sheet-close{
    width:32px;height:32px;
    background:#FCA5A5;
    border:2px solid #000;border-radius:9px;
    box-shadow:2px 2px 0 0 #000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .sheet-close:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}

  .sheet-body{padding:16px 18px}

  .sheet-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;font-weight:700;
    letter-spacing:1.5px;color:#666;
    text-transform:uppercase;
    margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .sheet-label .clear-recent{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:10px;font-weight:800;
    color:#dc2626;
    text-transform:none;
    letter-spacing:0;
    cursor:pointer;
    background:none;border:none;
    text-decoration:underline;
    text-underline-offset:2px;
  }

  .recent-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(72px, 1fr));
    gap:10px;
    margin-bottom:20px;
    min-height:80px;
  }

  .recent-item{
    aspect-ratio:1;
    border:2px solid #000;
    border-radius:12px;
    box-shadow:2px 2px 0 0 #000;
    position:relative;
    overflow:hidden;
    background:#FDFBF7;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .recent-item:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #000}

  .recent-item img{
    width:100%;height:100%;object-fit:cover;
  }
  .recent-item .file-preview{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:4px;
  }
  .recent-item .file-ext-badge{
    background:#86EFAC;
    border:1.5px solid #000;border-radius:5px;
    padding:2px 6px;
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:9px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .recent-item .file-ext-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:8px;color:#666;
    overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:90%;
    padding:0 4px;
  }
  .recent-item .recent-x{
    position:absolute;top:-4px;right:-4px;
    width:20px;height:20px;
    background:#FCA5A5;
    border:1.5px solid #000;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:2;
    box-shadow:1px 1px 0 0 #000;
  }
  .recent-item .recent-x svg{width:9px;height:9px}

  .recent-empty{
    grid-column:1/-1;
    padding:24px 12px;
    text-align:center;
    border:2px dashed #bbb;
    border-radius:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:#888;
    line-height:1.5;
  }

  .sheet-actions{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .sheet-action{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    padding:14px 6px 12px;
    background:#fff;
    border:2.5px solid #000;border-radius:14px;
    box-shadow:3px 3px 0 0 #000;
    cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;font-size:11.5px;
    color:#000;
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .sheet-action:active{
    transform:translate(1px,1px);
    box-shadow:1px 1px 0 0 #000;
  }
  .action-icon{
    width:44px;height:44px;
    border:2px solid #000;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .action-icon.camera{background:#86EFAC}
  .action-icon.album{background:#7DD3FC}
  .action-icon.doc{background:#FDE047}

  @media (max-width:380px){
    .brand-name{font-size:13px}
    .msg{max-width:92%;font-size:12.5px}
    .chat-scroll{padding:10px}
    .input-area{padding:8px}
    .icon-btn{width:40px;height:40px}
    .attach-thumb-wrap, .attach-thumb, .attach-file-icon{width:42px;height:42px}
    .recent-grid{grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));gap:8px}
    .sheet-actions{gap:8px}
    .sheet-action{padding:12px 4px 10px;font-size:11px}
    .action-icon{width:40px;height:40px}
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-name">NexusHUB AI</div>
        <div class="brand-sub">BY XS0CIETY</div>
      </div>
    </div>
    <div class="status-pill">
      <span id="statusDot" class="status-dot pulse"></span>
      <span id="statusText">READY</span>
    </div>
  </div>

  <div class="model-bar">
    <button id="modelBtn" class="model-btn" type="button">
      <div class="model-btn-left">
        <span id="modelDot" class="model-dot" style="background:#86EFAC"></span>
        <span id="modelName" class="model-name">Auto (Smart)</span>
      </div>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div id="dropdown" class="dropdown">
      <div class="dropdown-header">PILIH MODEL AI</div>
      <div id="modelList"></div>
    </div>
  </div>

  <div class="chat-wrap">
    <div id="chatScroll" class="chat-scroll"></div>
    <div id="errorBox" class="error-box"></div>

    <div class="input-area">

      <div id="attachBar" class="attach-bar">
        <div class="attach-thumb-wrap">
          <img id="attachThumb" class="attach-thumb" style="display:none" alt="">
          <div id="attachFileIcon" class="attach-file-icon" style="display:none">JS</div>
        </div>
        <div class="attach-info">
          <div class="attach-label">File Terlampir</div>
          <div id="attachName" class="attach-name">file.js</div>
          <div id="attachSize" class="attach-size">0 KB</div>
        </div>
        <button type="button" id="attachX" class="attach-x" title="Hapus">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="input-row">
        <button type="button" id="attachBtn" class="icon-btn" title="Lampirkan file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

<script>
/* =================================================================
   CONFIG
================================================================= */
const CONFIG = {
  PROXY_ENDPOINT: '/api/chat',
  SYSTEM_PROMPT: `Kamu adalah NexusHUB AI, asisten AI canggih dari xs0ciety HUB. Jawab dengan gaya santai tapi profesional dalam Bahasa Indonesia (atau Inggris kalau user pakai Inggris).

PENTING — ATURAN PANJANG JAWABAN:
- Jawab RINGKAS dan PADAT. Hindari basa-basi.
- Kalau user kirim kode/file: fokus ke poin utama. Jangan tulis tabel panjang atau analisa bertele-tele.
- Struktur ideal: 1) Ringkasan 2-3 baris, 2) Poin perbaikan (bullet, max 5-7 poin), 3) Contoh code kalau perlu (max 1 blok kecil).
- Kalau user minta analisa panjang, baru boleh detail — tapi tetap terstruktur.
- Jangan tulis "Berikut adalah..." atau "Semoga membantu!" — langsung ke isi.`,
  TEMPERATURE: 0.6,
  MAX_TOKENS: 1024,
  MAX_IMAGE_SIZE_MB: 3,
  MAX_TEXT_FILE_SIZE_KB: 50,
  MAX_TEXT_CHARS: 4000,
  FETCH_TIMEOUT_MS: 90000
};

/* =================================================================
   FILE TYPES
================================================================= */
const IMAGE_EXT = ['jpg','jpeg','png','gif','webp','bmp'];
const TEXT_EXT  = ['js','jsx','ts','tsx','py','json','txt','md','html','htm','css','scss','php','rb','go','rs','java','c','cpp','h','hpp','cs','swift','kt','sql','sh','bash','yaml','yml','xml','toml','ini','env','log','csv'];

const LANG_MAP = {
  js:'javascript', jsx:'javascript', ts:'typescript', tsx:'typescript',
  py:'python', rb:'ruby', go:'go', rs:'rust', java:'java',
  c:'c', cpp:'cpp', h:'c', hpp:'cpp', cs:'csharp', swift:'swift', kt:'kotlin',
  html:'html', htm:'html', css:'css', scss:'scss',
  php:'php', sql:'sql', sh:'bash', bash:'bash',
  yaml:'yaml', yml:'yaml', xml:'xml', toml:'toml', ini:'ini', env:'bash',
  json:'json', md:'markdown', txt:'text', log:'text', csv:'csv'
};

/* =================================================================
   MODELS
================================================================= */
const MODELS = [
  { id:'auto-smart',  name:'Auto (Smart)', model:'openrouter/free',           desc:'Auto-route ke model terbaik', color:'#86EFAC', supportVision:true  },
  { id:'qwen3-coder', name:'Qwen3 Coder',  model:'qwen/qwen3-coder:free',     desc:'Coding · High performance',   color:'#FDBA74', supportVision:false },
  { id:'gpt-oss-120b',name:'GPT-OSS 120B', model:'openai/gpt-oss-120b:free',  desc:'General purpose · Large',     color:'#C4B5FD', supportVision:false },
  { id:'gemma-3-27b', name:'Gemma 3 27B',  model:'google/gemma-3-27b-it:free',desc:'Multimodal · Google',         color:'#7DD3FC', supportVision:true  }
];

const DEFAULT_MODEL_ID = MODELS[0].id;
const MODEL_STORAGE_KEY = 'nexushub.model.v8';
const RECENT_KEY = 'nexushub.recent';
const MAX_RECENT = 12;

/* =================================================================
   UTILS
================================================================= */
const pad = n => String(n).padStart(2,'0');
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}.${pad(d.getMinutes())}`; };
const escapeHtml = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const getModelById = id => MODELS.find(m => m.id === id) || MODELS[0];
const fmtSize = bytes => {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(2) + ' MB';
};
const getExt = name => (name.split('.').pop() || '').toLowerCase();
const getFileType = file => {
  const ext = getExt(file.name);
  if (IMAGE_EXT.includes(ext)) return 'image';
  if (TEXT_EXT.includes(ext)) return 'text';
  if (file.type.startsWith('image/')) return 'image';
  if (file.type.startsWith('text/') || file.type.includes('json') || file.type.includes('javascript')) return 'text';
  return null;
};

/* =================================================================
   STATE
================================================================= */
let messageHistory = [];
let currentModel = getModelById(localStorage.getItem(MODEL_STORAGE_KEY) || DEFAULT_MODEL_ID);
let pendingFile = null;
let isSending = false;
let activeController = null;
let recentItems = [];

/* =================================================================
   DOM
================================================================= */

/* =================================================================
   RECENT FILES STORAGE
================================================================= */
function loadRecent(){
  try {
    const arr = JSON.parse(localStorage.getItem(RECENT_KEY));
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}

function saveRecent(items){
  try {
    while (items.length > 1) {
      try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(items));
        return;
      } catch { items.pop(); }
    }
    if (items.length === 1){
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(items)); return; }
      catch { localStorage.removeItem(RECENT_KEY); }
    }
  } catch {}
}

async function makeThumbFromImage(dataUrl){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const size = 96;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const ratio = Math.max(size / img.width, size / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;
        ctx.drawImage(img, (size - w)/2, (size - h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

async function addToRecent(file, type, dataUrl){
  let thumb = null;
  if (type === 'image' && dataUrl){
    thumb = await makeThumbFromImage(dataUrl);
  }

  const item = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    name: file.name,
    ext: getExt(file.name),
    size: file.size,
    type,
    thumb,
    ts: Date.now()
  };

  recentItems = loadRecent();
  // Skip kalau udah ada (by name + size)
  recentItems = recentItems.filter(x => !(x.name === item.name && x.size === item.size));
  recentItems.unshift(item);
  recentItems = recentItems.slice(0, MAX_RECENT);
  saveRecent(recentItems);
  renderRecent();
}

function renderRecent(){
  if (!recentItems.length){
    recentGrid.innerHTML = `<div class="recent-empty">Belum ada file terkirim.<br>File yang kamu kirim bakal muncul di sini.</div>`;
    return;
  }

  recentGrid.innerHTML = recentItems.map(it => {
    let inner = '';
    if (it.type === 'image' && it.thumb){
      inner = `<img src="${it.thumb}" alt="">`;
    } else {
      inner = `<div class="file-preview">
        <div class="file-ext-badge">${escapeHtml(it.ext.toUpperCase().slice(0,4))}</div>
        <div class="file-ext-sub">${escapeHtml(it.name)}</div>
      </div>`;
    }
    return `<div class="recent-item" data-id="${it.id}" title="${escapeHtml(it.name)} (${fmtSize(it.size)})">
      <button class="recent-x" data-remove="${it.id}" aria-label="Hapus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      ${inner}
    </div>`;
  }).join('');

  // Remove handlers
  recentGrid.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.remove;
      recentItems = recentItems.filter(x => x.id !== id);
      saveRecent(recentItems);
      renderRecent();
    });
  });
}

clearRecentBtn.addEventListener('click', () => {
  if (!recentItems.length) return;
  if (!confirm('Hapus semua riwayat file terbaru?')) return;
  recentItems = [];
  saveRecent(recentItems);
  renderRecent();
});

/* =================================================================
   BOTTOM SHEET
================================================================= */
function openSheet(){
  sheetBackdrop.classList.add('show');
  attachSheet.classList.add('show');
  document.body.style.overflow = 'hidden';
  renderRecent();
}

function closeSheet(){
  sheetBackdrop.classList.remove('show');
  attachSheet.classList.remove('show');
  document.body.style.overflow = '';
}

attachBtn.addEventListener('click', () => {
  if (!currentModel.supportVision){
    // masih bisa kirim file text
  }
  openSheet();
});

sheetBackdrop.addEventListener('click', closeSheet);
sheetClose.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && attachSheet.classList.contains('show')) closeSheet();
});

// Swipe down to close
let sheetStartY = 0, sheetDragging = false;
attachSheet.addEventListener('touchstart', e => {
  if (attachSheet.scrollTop <= 0){
    sheetStartY = e.touches[0].clientY;
    sheetDragging = true;
  }
}, { passive: true });
attachSheet.addEventListener('touchmove', e => {
  if (!sheetDragging) return;
  const dy = e.touches[0].clientY - sheetStartY;
  if (dy > 0){
    attachSheet.style.transform = `translateY(${dy}px)`;
  }
}, { passive: true });
attachSheet.addEventListener('touchend', e => {
  if (!sheetDragging) return;
  sheetDragging = false;
  const endY = e.changedTouches[0].clientY;
  const dy = endY - sheetStartY;
  attachSheet.style.transform = '';
  if (dy > 100) closeSheet();
});

// Action buttons
actionCamera.addEventListener('click', () => cameraInput.click());
actionAlbum.addEventListener('click',  () => albumInput.click());
actionDoc.addEventListener('click',    () => docInput.click());

/* =================================================================
   MODEL SELECTOR
================================================================= */
function renderModelList(){
  modelList.innerHTML = '';
  MODELS.forEach(m => {
    const isActive = m.id === currentModel.id;
    const el = document.createElement('div');
    el.className = 'model-item' + (isActive ? ' active' : '');
    el.innerHTML = `
      <span class="dot" style="background:${m.color}"></span>
      <div class="info">
        <div class="title">${escapeHtml(m.name)}</div>
        <div class="desc">${escapeHtml(m.desc)}</div>
      </div>
    `;
    el.addEventListener('click', () => {
      selectModel(m.id);
      dropdown.classList.remove('show');
    });
    modelList.appendChild(el);
  });
}

function selectModel(id){
  const m = getModelById(id);
  if (m.id === currentModel.id) return;
  currentModel = m;
  localStorage.setItem(MODEL_STORAGE_KEY, m.id);
  modelNameEl.textContent = m.name;
  modelDotEl.style.background = m.color;

  messageHistory = [];
  chatScroll.innerHTML = '';
  addMessage('assistant',
    `Model diganti ke **${m.name}**.\n\n${m.desc}\n\nMulai percakapan baru ya!`,
    { badge: m.name, color: m.color }
  );

  if (pendingFile && pendingFile.type === 'image' && !m.supportVision){
    clearFile();
    showError(`${m.name} tidak support gambar. Attachment dihapus.`);
  }
  renderModelList();
}

modelBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdown.classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!dropdown.contains(e.target) && e.target !== modelBtn){
    dropdown.classList.remove('show');
  }
});

/* =================================================================
   FILE HANDLING
================================================================= */
cameraInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  handleFile(file);
  cameraInput.value = '';
  closeSheet();
});

albumInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  handleFile(file);
  albumInput.value = '';
  closeSheet();
});

docInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  handleFile(file);
  docInput.value = '';
  closeSheet();
});

function handleFile(file){
  const ftype = getFileType(file);

  if (!ftype){
    showError(`Tipe file tidak didukung: .${getExt(file.name)}`);
    return;
  }

  if (ftype === 'image'){
    if (!currentModel.supportVision){
      showError(`${currentModel.name} tidak support gambar. Pakai Auto atau Gemma 3.`);
      return;
    }
    if (file.size > CONFIG.MAX_IMAGE_SIZE_MB * 1024 * 1024){
      showError(`Gambar max ${CONFIG.MAX_IMAGE_SIZE_MB} MB.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      pendingFile = {
        type: 'image',
        dataUrl,
        name: file.name,
        size: file.size,
        ext: getExt(file.name)
      };
      showFilePreview();
      addToRecent(file, 'image', dataUrl);
    };
    reader.onerror = () => showError('Gagal baca gambar.');
    reader.readAsDataURL(file);
    return;
  }

  if (ftype === 'text'){
    if (file.size > CONFIG.MAX_TEXT_FILE_SIZE_KB * 1024){
      showError(`File text max ${CONFIG.MAX_TEXT_FILE_SIZE_KB} KB.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      pendingFile = {
        type: 'text',
        text: ev.target.result,
        name: file.name,
        size: file.size,
        ext: getExt(file.name)
      };
      showFilePreview();
      addToRecent(file, 'text', null);
    };
    reader.onerror = () => showError('Gagal baca file.');
    reader.readAsText(file);
    return;
  }
}

function showFilePreview(){
  if (!pendingFile) return;
  attachBar.classList.remove('image','text');
  if (pendingFile.type === 'image'){
    attachBar.classList.add('image');
    attachThumb.src = pendingFile.dataUrl;
    attachThumb.style.display = 'block';
    attachFileIcon.style.display = 'none';
  } else {
    attachBar.classList.add('text');
    attachThumb.style.display = 'none';
    attachFileIcon.style.display = 'flex';
    attachFileIcon.textContent = pendingFile.ext.toUpperCase().slice(0, 4);
  }
  attachName.textContent = pendingFile.name;
  attachSize.textContent = fmtSize(pendingFile.size);
  attachBar.classList.add('show');
}

function clearFile(){
  pendingFile = null;
  attachBar.classList.remove('show','image','text');
  attachThumb.src = '';
}

/* =================================================================
   INPUT
================================================================= */
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

  }
});

/* =================================================================
   SEND
================================================================= */
async function sendMessage(){
  const message = chatInput.value.trim();
  const hasFile = !!pendingFile;
  if ((!message && !hasFile) || isSending) return;

  const displayOpts = {};
  if (pendingFile?.type === 'image') displayOpts.image = pendingFile.dataUrl;
  if (pendingFile?.type === 'text') displayOpts.file = { name: pendingFile.name, ext: pendingFile.ext };

  addMessage('user', message || (hasFile ? '(mengirim file)' : ''), displayOpts);

  const apiContent = buildUserContent(message, pendingFile);

  chatInput.value = '';
  chatInput.style.height = 'auto';
  clearFile();
  isSending = true;
  sendBtn.disabled = true;
  setStatus('THINKING', null);
  showTyping();

  try {
    const reply = await callProxy(apiContent);
    hideTyping();
    addMessage('assistant', reply, { badge: currentModel.name, color: currentModel.color });
    messageHistory.push({ role: 'user', content: apiContent });
    messageHistory.push({ role: 'assistant', content: reply });
    setStatus('READY', true);
  } catch (err){
    hideTyping();
    showError(err.message);
    setStatus('ERROR', false);
  }

  isSending = false;
  sendBtn.disabled = false;
  activeController = null;
  chatInput.focus();
}

function buildUserContent(text, file){
  if (!file) return text || '';

  if (file.type === 'image'){
    const parts = [];
    if (text) parts.push({ type: 'text', text });
    parts.push({ type: 'image_url', image_url: { url: file.dataUrl } });
    return parts;
  }

  if (file.type === 'text'){
    const lang = LANG_MAP[file.ext] || file.ext || 'text';
    let fileText = file.text;
    let truncated = false;
    if (fileText.length > CONFIG.MAX_TEXT_CHARS){
      fileText = fileText.slice(0, CONFIG.MAX_TEXT_CHARS);
      truncated = true;
    }
    const header = text ? `${text}\n\n` : '';
    const truncNote = truncated ? `\n\n... (file terpotong, hanya ${CONFIG.MAX_TEXT_CHARS.toLocaleString()} karakter pertama)` : '';
    return `${header}\`\`\`${lang}\n// File: ${file.name}\n${fileText}\`\`\`${truncNote}`;
  }

  return text || '';
}

/* =================================================================
   API
================================================================= */
async function callProxy(userContent){
  if (activeController) activeController.abort();
  activeController = new AbortController();

  const timeoutId = setTimeout(() => activeController.abort(), CONFIG.FETCH_TIMEOUT_MS);

  const messages = [
    { role: 'system', content: CONFIG.SYSTEM_PROMPT },
    ...messageHistory.slice(-12),
    { role: 'user', content: userContent }
  ];

  const body = {
    model: currentModel.model,
    messages,
    temperature: CONFIG.TEMPERATURE,
    max_tokens: CONFIG.MAX_TOKENS
  };

  let res;
  try {
    res = await fetch(CONFIG.PROXY_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: activeController.signal
    });
  } catch (err){
    clearTimeout(timeoutId);
    if (err.name === 'AbortError'){
      throw new Error('Request dibatalkan atau timeout. Coba lagi dengan pesan lebih singkat.');
    }
    throw new Error('Koneksi ke server gagal. Cek internet kamu.');
  }
  clearTimeout(timeoutId);

  const contentType = res.headers.get('content-type') || '';
  if (!contentType.includes('json')){
    if (res.status === 504){
      throw new Error('AI butuh waktu lebih lama. Coba kirim file atau pesan yang lebih kecil.');
    }
    if (res.status === 502 || res.status === 503){
      throw new Error('Server sedang sibuk. Coba lagi sebentar.');
    }
    if (res.status === 413){
      throw new Error('File atau pesan terlalu besar. Perkecil dulu.');
    }
    throw new Error(`Server error (HTTP ${res.status}). Coba lagi.`);
  }

  let data;
  try { data = await res.json(); }
  catch { throw new Error(`Gagal parsing response. HTTP ${res.status}`); }

  if (!res.ok){
    const errMsg = data?.error?.message || data?.message || `HTTP ${res.status}`;
    throw new Error(errMsg);
  }

  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('AI tidak membalas dengan benar. Coba lagi.');
  return content;
}

/* =================================================================
   RENDER MESSAGE
================================================================= */
function addMessage(role, content, opts = {}){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  let html = '';
  if (role === 'assistant' && opts.badge){
    html += `<span class="msg-model" style="background:${opts.color || '#86EFAC'}">${escapeHtml(opts.badge)}</span>`;
  }
  if (opts.image){
    html += `<img src="${opts.image}" class="msg-image" onclick="openImage(this.src)" alt="">`;
  }
  if (opts.file){
    html += `<div class="msg-file">
      <span class="file-ext">${escapeHtml(opts.file.ext)}</span>
      <span class="file-name">${escapeHtml(opts.file.name)}</span>
    </div>`;
  }
  if (content){
    html += `<span class="msg-text">${formatMessage(content)}</span>`;
  }
  html += `<div class="msg-time">${nowTime()}</div>`;

  wrap.innerHTML = html;

  const typing = document.getElementById('typingIndicator');
  if (typing) chatScroll.insertBefore(wrap, typing);
  else chatScroll.appendChild(wrap);

  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function formatMessage(content){
  if (Array.isArray(content)){
    const t = content.find(p => p.type === 'text');
    content = t?.text || '';
  }
  if (typeof content !== 'string') content = String(content);
  if (!content) return '';

  if (content.includes('```')){
    const parts = content.split('```');
    let html = '';
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 0){
        html += renderInline(parts[i]);
      } else {
        const lines = parts[i].split('\n');
        const lang = (lines[0] || 'code').trim() || 'code';
        const code = lines.slice(1).join('\n');
        html += `
          <div class="code-block">
            <div class="code-header">
              <span class="code-lang">${escapeHtml(lang)}</span>
              <button class="copy-btn" onclick="copyCode(this)">Salin</button>
            </div>
            <pre><code>${escapeHtml(code)}</code></pre>
          </div>`;
      }
    }
    return html;
  }
  return renderInline(content);
}

function renderInline(text){
  let s = escapeHtml(text);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:#eee;padding:1px 5px;border-radius:4px;border:1px solid #000;font-family:JetBrains Mono,monospace;font-size:11px">$1</code>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

window.copyCode = function(btn){
  const code = btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'OK';
    setTimeout(() => { btn.textContent = orig; }, 1200);
  });
};

window.openImage = function(src){
  const w = window.open('');
  if (w){
    w.document.write(`<html><head><title>Image</title><style>body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh}img{max-width:95vw;max-height:95vh;border:3px solid #000}</style></head><body><img src="${src}"></body></html>`);
    w.document.close();
  }
};

/* =================================================================
   TYPING / STATUS / ERROR
================================================================= */
function showTyping(){
  let t = document.getElementById('typingIndicator');
  if (!t){
    t = document.createElement('div');
    t.id = 'typingIndicator';
    t.className = 'typing';
    t.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
    chatScroll.appendChild(t);
  }
  t.classList.add('show');
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if (t) t.classList.remove('show');
}

function showError(msg){
  let display = msg;
  if (display.length > 400) display = display.slice(0, 400) + '...';
  errorBox.textContent = display;
  errorBox.classList.add('show');
  clearTimeout(errorBox._t);
  errorBox._t = setTimeout(() => errorBox.classList.remove('show'), 15000);
  console.error('[NexusHUB]', msg);
}

function setStatus(text, ok){
  statusText.textContent = text;
  statusDot.classList.remove('offline','busy');
  if (ok === false) statusDot.classList.add('offline');
  else if (ok === null) statusDot.classList.add('busy');
}

/* =================================================================
   INIT
================================================================= */
function initChat(){
  modelNameEl.textContent = currentModel.name;
  modelDotEl.style.background = currentModel.color;
  renderModelList();

  chatScroll.innerHTML = '';
  messageHistory = [];

  addMessage('assistant',
    `Halo! Saya **NexusHUB AI**.\n\nModel aktif: **${currentModel.name}**\n\nKlik icon klip buat kirim gambar atau file code.`,
    { badge: currentModel.name, color: currentModel.color }
  );

  // Load recent files
  recentItems = loadRecent();
  renderRecent();
}

initChat();
chatInput.focus();
</script>
